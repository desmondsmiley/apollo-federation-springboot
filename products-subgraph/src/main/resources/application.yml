server:
  port: 8082

spring:
  application:
    name: products-subgraph

dgs:
  graphql:
    path: /graphql
    schema-locations: classpath*:graphql/**/*.graphqls
    graphiql:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
